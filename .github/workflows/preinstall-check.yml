name: Preinstall trust check

# Runs the same trust check we ask users to run before installing.
# If this job fails on a PR, the PR is not safe to merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preinstall-check:
    name: scripts/agent-preinstall-check.sh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run preinstall trust check
        run: |
          chmod +x scripts/*.sh
          bash scripts/agent-preinstall-check.sh

  release-audit:
    name: scripts/public-release-audit.sh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run public release audit
        run: |
          chmod +x scripts/*.sh
          bash scripts/public-release-audit.sh
