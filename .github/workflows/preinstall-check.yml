name: Preinstall trust check

# Runs the same trust check we ask users to run before installing.
# If this job fails on a PR, the PR is not safe to merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preinstall-check:
    name: scripts/agent-preinstall-check.sh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run preinstall trust check
        run: |
          chmod +x scripts/*.sh
          bash scripts/agent-preinstall-check.sh

  release-audit:
    name: scripts/public-release-audit.sh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run public release audit
        run: |
          chmod +x scripts/*.sh
          bash scripts/public-release-audit.sh
